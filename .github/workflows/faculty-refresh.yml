name: Refresh faculty candidate evidence
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/collect_faculty.py"
      - "config/**"
      - ".github/workflows/faculty-refresh.yml"
  schedule:
    - cron: "17 4 * * 1"
permissions:
  contents: write
concurrency:
  group: faculty-refresh
  cancel-in-progress: true
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/collect_faculty.py
      - name: Commit changed evidence
        run: |
          git config user.name "application-intelligence-bot"
          git config user.email "application-intelligence-bot@users.noreply.github.com"
          git add data/generated-faculty.js data/collection-report.json
          git diff --cached --quiet || git commit -m "Refresh faculty candidate evidence"
          git push
