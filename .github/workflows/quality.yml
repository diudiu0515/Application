name: Static application quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check app.js && node --check modules.js && node --check modules-data.js && node --check faculty-review.js && node --check data-tools.js && node --check candidate-workspace.js && node --check application-workspace.js && node --check evidence.js && node --check summer-workspace.js && node --check calendar-workspace.js && node --check fit-workspace.js && node --check decision-tools.js && node --check search-tools.js && node --check program-workspace.js && node --check shortlist-workspace.js && node --check materials-workspace.js && node --check intelligence-workspace.js && node --check faculty-operations.js && node --check faculty-detail-workspace.js && node --check requirements-completion.js && node --check seed.js
      - run: npx --yes prisma@6.19.0 validate --schema prisma/schema.prisma
        env:
          DATABASE_URL: file:./ci.db
      - run: npx --yes prisma@6.19.0 migrate deploy --schema prisma/schema.prisma
        env:
          DATABASE_URL: file:./ci.db
      - run: npx --yes prisma@6.19.0 migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --exit-code
        env:
          DATABASE_URL: file:./ci.db
      - run: python -m py_compile scripts/collect_faculty.py
      - run: python -m unittest tests/test_collector.py
      - run: python -m json.tool config/top50-programs.json >/dev/null && python -m json.tool config/research-directions.json >/dev/null && python -m json.tool config/faculty-adapters.json >/dev/null
      - run: python -m pip install quickjs==1.19.4
      - run: python tests/runtime_smoke.py
